# /etc/nginx/sites-available/screenshare.conf
# Screen capture (getDisplayMedia) only works on HTTPS pages, so TLS is required.
server {
    listen 80;
    server_name screen.example.com;
    location /.well-known/acme-challenge/ { root /opt/screenshare/web; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name screen.example.com;
    ssl_certificate     /etc/nginx/ssl/screenshare/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/screenshare/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/screenshare/web;
    add_header X-Content-Type-Options nosniff always;

    location / { index index.html; try_files $uri $uri/ $uri.html =404; }

    # WHIP / WHEP signalling -> mediamtx
    location /m/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect / /m/;
        client_max_body_size 1m;
    }

    # status API used by the web pages
    location /api/ {
        proxy_pass http://127.0.0.1:8890/api/;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
